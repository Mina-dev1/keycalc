<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light-only">
    <title>Document</title>
    <link rel="stylesheet" href="./calc.css">
</head>
<body>
    <div class="calculator">
        <div class="header">
            <h1>KeyCalc</h1>
            <p>smart keyboard calculator</p>
        </div>
        <div class="display">
            <div class="top-text" id="top-text"></div>
            <div class="bottom-text">
                <div id="bottom-text"></div>
                <div id="computation-text"></div>
            </div>
        </div>
        <div class="button">
            <button class="btn-number" data-number = "7">7</button>
            <button class="btn-number" data-number = "8">8</button>
            <button class="btn-number" data-number = "9">9</button>
            <button class="btn-operation" data-clr = "CLR">CLR</button>
            <button class="btn-operation" data-ac = "AC">AC</button>
            <button class="btn-number" data-number = "4">4</button>
            <button class="btn-number" data-number = "5">5</button>
            <button class="btn-number" data-number = "6">6</button>
            <button class="btn-operation" data-operation = "x">x</button>
            <button class="btn-operation" data-operation="/">/</button>
            <button class="btn-number" data-number = "1">1</button>
            <button class="btn-number" data-number = "2">2</button>
            <button class="btn-number" data-number = "3">3</button>
            <button class="btn-operation" data-operation = "-">-</button>
            <button class="btn-operation" data-operation = "+">+</button>
            <button class="btn-number" data-number = "0">0</button>
            <button class="btn-number" data-action = "decimal">.</button>
            <button class="btn-number" data-answer = "ans">ANS</button>
            <button class="btn-operation" data-operation="%">%</button>
            <button class="btn-operation" data-equal = "=">=</button>
        </div>
    </div>
    <script src="./calc.js"></script>
</body>
</html>
